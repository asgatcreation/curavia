name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  backend-lint:
    name: Backend lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check --output-format=github .

      - name: Ruff (format)
        working-directory: backend
        run: ruff format --check --diff .

      - name: mypy
        working-directory: backend
        run: mypy apps integrations config

  cross-tenant-guard:
    name: Cross-tenant escape hatches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The tenant guard only works if the escape hatch stays rare and
      # visible. Every use of `.unscoped` or `unscoped(` must be listed in
      # docs/cross-tenant-allowlist.txt with a reason, so adding one is a
      # deliberate, reviewable act rather than a quiet convenience.
      - name: Check the allowlist is complete
        run: bash scripts/check-cross-tenant-allowlist.sh

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: curavia
          POSTGRES_USER: curavia
          POSTGRES_PASSWORD: curavia-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U curavia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      # `check --deploy` rejects a key under 50 characters (security.W009),
      # so this is long as well as obviously disposable. Not used anywhere else.
      DJANGO_SECRET_KEY: ci-only-disposable-key-not-used-for-anything-real-0192837465
      POSTGRES_DB: curavia
      POSTGRES_USER: curavia
      POSTGRES_PASSWORD: curavia-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create the extensions the search layer needs
        env:
          PGPASSWORD: curavia-ci
        run: |
          psql -h localhost -U curavia -d curavia \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
            -c "CREATE EXTENSION IF NOT EXISTS unaccent;"

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        working-directory: backend
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: curavia.example
          CORS_ALLOWED_ORIGINS: https://curavia.example
          CSRF_TRUSTED_ORIGINS: https://curavia.example

      # Needs no database and takes a second. A wrong URL name makes the
      # suites below fail with NoReverseMatch, which reads like a security
      # regression and is not one — so it is ruled out first.
      - name: Structural checks (URLs, API base classes)
        working-directory: backend
        run: pytest tests/test_urls.py tests/test_api_base.py -q --tb=short

      # Then these two, first and separately. If a hospital can see another
      # hospital's data, nothing else about the build matters.
      - name: Tenant isolation suite
        working-directory: backend
        run: |
          set -o pipefail
          status=0
          pytest tests/isolation -v --tb=short -p no:cacheprovider 2>&1 | tee /tmp/pytest.log || status=$?
          {
            echo "### Tenant isolation suite"
            echo
            echo '```'
            tail -n 150 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            # Logs and job summaries both need a GitHub sign-in, even on a
            # public repository. Annotations do not, so a red build explains
            # itself to anyone looking at the run.
            grep -E "^(FAILED|ERROR) " /tmp/pytest.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=Tenant isolation suite::$line"
            done
            grep -E "^E +[A-Za-z]" /tmp/pytest.log | head -n 12 | while IFS= read -r line; do
              echo "::error title=Tenant isolation suite (assertion)::$line"
            done
          fi
          exit $status

      - name: Permissions matrix suite
        working-directory: backend
        run: |
          set -o pipefail
          status=0
          pytest tests/permissions -q --tb=short -p no:cacheprovider 2>&1 | tee /tmp/pytest.log || status=$?
          {
            echo "### Permissions matrix suite"
            echo
            echo '```'
            tail -n 150 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            # Logs and job summaries both need a GitHub sign-in, even on a
            # public repository. Annotations do not, so a red build explains
            # itself to anyone looking at the run.
            grep -E "^(FAILED|ERROR) " /tmp/pytest.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=Permissions matrix suite::$line"
            done
            grep -E "^E +[A-Za-z]" /tmp/pytest.log | head -n 12 | while IFS= read -r line; do
              echo "::error title=Permissions matrix suite (assertion)::$line"
            done
          fi
          exit $status

      - name: Full test suite with coverage
        working-directory: backend
        run: |
          set -o pipefail
          status=0
          pytest --cov --cov-report=term-missing --cov-report=xml --tb=short 2>&1 | tee /tmp/pytest.log || status=$?
          {
            echo "### Full test suite"
            echo
            echo '```'
            tail -n 150 /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            # Logs and job summaries both need a GitHub sign-in, even on a
            # public repository. Annotations do not, so a red build explains
            # itself to anyone looking at the run.
            grep -E "^(FAILED|ERROR) " /tmp/pytest.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=Full test suite::$line"
            done
            grep -E "^E +[A-Za-z]" /tmp/pytest.log | head -n 12 | while IFS= read -r line; do
              echo "::error title=Full test suite (assertion)::$line"
            done
          fi
          exit $status

      - name: OpenAPI schema is valid and current
        working-directory: backend
        run: python manage.py spectacular --fail-on-warn --file /tmp/schema.yml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci`, not `npm install`: the lock file landed at milestone 3, and
      # CI must install exactly what is locked rather than resolving afresh.
      - name: Install dependencies
        run: npm ci --no-audit --fund=false

      - name: ESLint
        run: npm run lint --workspaces --if-present

      - name: TypeScript
        run: npm run typecheck --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
